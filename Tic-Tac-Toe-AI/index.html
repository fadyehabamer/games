<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tic-Tac-Toe</title>
  <meta name="description" content="Tic-tac-toe for two players on one screen, or against the computer.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <h1>Tic-Tac-Toe</h1>
    <form class="options" id="options">
      <fieldset>
        <legend>Mode</legend>
        <label><input type="radio" name="mode" value="two" checked> Two players</label>
        <label><input type="radio" name="mode" value="ai"> Against the computer</label>
      </fieldset>
      <fieldset id="side-options" disabled>
        <legend>You play</legend>
        <label><input type="radio" name="side" value="X" checked> X, first</label>
        <label><input type="radio" name="side" value="O"> O, second</label>
      </fieldset>
      <fieldset id="level-options" disabled>
        <legend>Computer</legend>
        <label><input type="radio" name="level" value="hard" checked> Unbeatable</label>
        <label><input type="radio" name="level" value="easy"> Easy</label>
      </fieldset>
    </form>
    <p id="status" class="status" role="status" aria-live="polite"></p>
    <div id="board" class="board" role="group" aria-label="Board"></div>
    <div class="actions">
      <button id="new-round" type="button">New round</button>
    </div>
  </main>
  <script src="rules.js"></script>
  <script src="main.js"></script>
</body>
</html>
