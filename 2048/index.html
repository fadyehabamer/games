<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2048</title>
  <meta name="description" content="Slide numbered tiles around a 4x4 board and merge equal ones until you reach 2048.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <header class="top">
      <h1>2048</h1>
      <div class="scores">
        <div class="score-box"><span class="label">Score</span><span id="score" class="value">0</span></div>
        <div class="score-box"><span class="label">Best</span><span id="best" class="value">0</span></div>
      </div>
    </header>
    <div class="bar">
      <div class="actions">
        <button id="new-game" type="button">New game</button>
      </div>
    </div>
    <p class="help" id="help">Use the arrow keys to slide the tiles. Two equal tiles merge into one.</p>
    <div class="board-wrap">
      <div id="board" class="board" tabindex="0" role="group" aria-label="Game board" aria-describedby="help"></div>
      <div id="overlay" class="overlay" hidden>
        <p id="overlay-text" class="overlay-text"></p>
        <div class="overlay-actions">
          <button id="keep-going" type="button">Keep going</button>
          <button id="try-again" type="button">New game</button>
        </div>
      </div>
    </div>
    <p id="status" class="status" role="status" aria-live="polite"></p>
  </main>
  <script src="rules.js"></script>
  <script src="main.js"></script>
</body>
</html>
