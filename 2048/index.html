<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2048</title>
  <meta name="description" content="Slide numbered tiles around a 4x4 board and merge equal ones until you reach 2048.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <header class="top">
      <h1>2048</h1>
      <div class="actions">
        <button id="new-game" type="button">New game</button>
      </div>
    </header>
    <p class="help" id="help">Use the arrow keys to slide the tiles. Two equal tiles merge into one.</p>
    <div id="board" class="board" tabindex="0" role="group" aria-label="Game board" aria-describedby="help"></div>
  </main>
  <script src="rules.js"></script>
  <script src="main.js"></script>
</body>
</html>
