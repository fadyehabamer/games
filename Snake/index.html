<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snake</title>
  <meta name="description" content="Classic Snake on a canvas. Eat the food, grow longer and don't run into the walls or yourself.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <header class="top">
      <h1>Snake</h1>
      <div class="actions">
        <button id="pause" type="button" aria-pressed="false" disabled>Pause</button>
        <button id="restart" type="button">Restart</button>
      </div>
    </header>
    <div class="scores">
      <p>Score <strong id="score">0</strong></p>
      <p>Best <strong id="best">0</strong></p>
    </div>
    <p class="help" id="help">Arrow keys or WASD to steer. Space or P pauses. The snake speeds up as it grows.</p>
    <canvas id="board" class="board" width="400" height="400" tabindex="0" role="img" aria-label="Snake board" aria-describedby="help"></canvas>
    <p id="status" class="status" role="status" aria-live="polite"></p>
  </main>
  <script src="rules.js"></script>
  <script src="main.js"></script>
</body>
</html>
